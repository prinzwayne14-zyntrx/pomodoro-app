<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Solo Leveling</title>
<meta name="theme-color" content="#06070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solo Leveling">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root {
    --bg: #06070c;
    --glass: rgba(255,255,255,.045);
    --glass-2: rgba(255,255,255,.075);
    --line: rgba(150,170,255,.14);
    --text: #eef1ff;
    --muted: #7f86a8;
    --g1: #6f7bff;
    --g2: #35c8ff;
    --glow: rgba(88,140,255,.55);
    --ink: #05060b;
  }
  body[data-mode="short"] { --g1: #19d3a7; --g2: #5be7ff; --glow: rgba(40,220,190,.5); }
  body[data-mode="long"]  { --g1: #f6c453; --g2: #ff8a4c; --glow: rgba(255,170,90,.5); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) 18px 0;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    position: relative;
  }
  body::before, body::after {
    content: ""; position: fixed; z-index: -1; pointer-events: none;
    width: 140vmax; height: 140vmax; border-radius: 50%;
    filter: blur(60px); opacity: .55; transition: background 1s;
  }
  body::before {
    top: -95vmax; left: -55vmax;
    background: radial-gradient(circle, var(--glow) 0%, transparent 60%);
    animation: drift 24s ease-in-out infinite alternate;
  }
  body::after {
    bottom: -105vmax; right: -60vmax; opacity: .35;
    background: radial-gradient(circle, var(--g2) 0%, transparent 60%);
    animation: drift 30s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift { to { transform: translate3d(8vmax, 6vmax, 0) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { body::before, body::after { animation: none; } }

  .wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; flex: 1; min-height: 0; }

  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 2px 10px; }
  .brand {
    font-size: 14px; font-weight: 800; letter-spacing: .34em; text-transform: uppercase;
    background: linear-gradient(90deg, #fff 0%, var(--g2) 55%, var(--g1) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--glass); color: var(--text); display: grid; place-items: center; cursor: pointer;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .icon-btn svg { width: 18px; height: 18px; }

  .glass {
    background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 30px rgba(0,0,0,.35);
  }

  /* player card */
  .player { display: flex; align-items: center; gap: 14px; padding: 12px 14px; }
  .rank {
    width: 50px; height: 56px; flex: none; display: grid; place-items: center;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: linear-gradient(160deg, var(--g2), var(--g1));
    color: var(--ink); font-weight: 900; font-size: 24px; position: relative;
    filter: drop-shadow(0 0 10px var(--glow));
  }
  .rank span { position: relative; }
  .pinfo { flex: 1; min-width: 0; }
  .prow { display: flex; justify-content: space-between; align-items: baseline; }
  .lv { font-size: 17px; font-weight: 800; letter-spacing: .02em; }
  .lv small { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin-left: 6px; }
  .xpn { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .bar { height: 7px; border-radius: 99px; background: rgba(255,255,255,.07); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 99px;
    background: linear-gradient(90deg, var(--g1), var(--g2)); box-shadow: 0 0 12px var(--glow);
    transition: width .6s cubic-bezier(.2,.8,.2,1); }

  /* views */
  .views { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view { display: none; flex: 1; min-height: 0; }
  .view.active { display: flex; flex-direction: column; }
  #timerView { align-items: center; justify-content: space-evenly; gap: 10px; padding-top: 12px; }

  .tabs { width: 100%; display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; padding: 4px; border-radius: 14px; }
  .tab { border: 0; background: transparent; color: var(--muted); padding: 10px 0; border-radius: 10px;
    font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; transition: all .25s; }
  .tab.active { color: var(--ink); background: linear-gradient(135deg, var(--g2), var(--g1)); box-shadow: 0 4px 18px var(--glow); }

  .ring-wrap { position: relative; width: min(74vw, 40dvh, 310px); aspect-ratio: 1; }
  .ring-wrap svg { width: 100%; height: 100%; overflow: visible; }
  .ring-wrap .rot { transform: rotate(-90deg); transform-origin: 60px 60px; }
  .track { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 5; }
  .progress { fill: none; stroke: url(#grad); stroke-width: 5; stroke-linecap: round;
    filter: drop-shadow(0 0 5px var(--glow)); transition: stroke-dashoffset .3s linear; }
  .endcap { fill: #fff; filter: drop-shadow(0 0 6px var(--g2)) drop-shadow(0 0 12px var(--glow)); }
  .tick { stroke: rgba(255,255,255,.16); stroke-width: .6; }
  .tick.big { stroke: rgba(255,255,255,.34); stroke-width: .9; }
  .time { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #clock { font-size: clamp(52px, 17vw, 74px); font-weight: 200; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 28px var(--glow); }
  #label { margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; }
  .live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--g2); margin-right: 8px;
    box-shadow: 0 0 8px var(--g2); animation: pulse 1.4s ease-in-out infinite; vertical-align: 1px; }
  @keyframes pulse { 50% { opacity: .25; } }

  .controls { display: flex; align-items: center; gap: 22px; }
  .btn-main {
    min-width: 168px; height: 62px; border: 0; border-radius: 31px; cursor: pointer;
    background: linear-gradient(135deg, var(--g2), var(--g1)); color: var(--ink);
    font-size: 14px; font-weight: 900; letter-spacing: .22em; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 8px 30px var(--glow), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .12s, box-shadow .3s;
  }
  .btn-main:active { transform: scale(.95); }
  .btn-main svg { width: 20px; height: 20px; }
  .btn-side { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass);
    color: var(--text); display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .btn-side:active { background: var(--glass-2); }
  .btn-side svg { width: 20px; height: 20px; }

  .dots { display: flex; gap: 9px; align-items: center; height: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.12); transition: all .3s; }
  .dot.done { background: var(--g2); box-shadow: 0 0 10px var(--glow); }

  /* stats */
  #statsView { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 0 14px; gap: 12px; }
  #statsView::-webkit-scrollbar { display: none; }
  .hero { padding: 18px 18px 16px; display: flex; justify-content: space-between; align-items: flex-end; }
  .k { color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
  .big { font-size: 40px; font-weight: 200; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 4px; text-shadow: 0 0 24px var(--glow); }
  .big small { font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: 0; margin-left: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { padding: 14px 16px; }
  .card .v { font-size: 24px; font-weight: 300; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .card .v small { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 3px; }
  .chart { padding: 16px 16px 12px; }
  .bars { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; align-items: end; height: 130px; margin-top: 14px; }
  .col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 6px; }
  .col b { font-size: 10px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 12px; }
  .col i { width: 100%; max-width: 28px; border-radius: 8px 8px 4px 4px; background: rgba(255,255,255,.1); min-height: 4px; transition: height .6s cubic-bezier(.2,.8,.2,1); }
  .col.today i { background: linear-gradient(180deg, var(--g2), var(--g1)); box-shadow: 0 0 16px var(--glow); }
  .col.has i { background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.12)); }
  .col.today.has i { background: linear-gradient(180deg, var(--g2), var(--g1)); }
  .col span { font-size: 10px; letter-spacing: .1em; color: var(--muted); font-weight: 700; text-transform: uppercase; }
  .col.today span { color: var(--text); }
  .heat { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; margin-top: 14px; }
  .heat i { aspect-ratio: 1; border-radius: 6px; background: rgba(255,255,255,.05); }
  .heat i.l1 { background: color-mix(in srgb, var(--g1) 28%, transparent); }
  .heat i.l2 { background: color-mix(in srgb, var(--g1) 50%, transparent); }
  .heat i.l3 { background: color-mix(in srgb, var(--g2) 72%, transparent); }
  .heat i.l4 { background: var(--g2); box-shadow: 0 0 10px var(--glow); }
  .heat i.now { outline: 1.5px solid rgba(255,255,255,.7); outline-offset: 1px; }
  .link { background: none; border: 0; color: var(--muted); font-size: 12px; text-decoration: underline; padding: 10px; cursor: pointer; align-self: center; }

  /* bottom nav */
  nav { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; margin: 4px 0 calc(env(safe-area-inset-bottom) + 10px); border-radius: 20px; }
  nav button { border: 0; background: transparent; color: var(--muted); padding: 10px 0 8px; border-radius: 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; transition: all .25s; }
  nav button svg { width: 20px; height: 20px; }
  nav button.active { color: var(--text); background: var(--glass-2); box-shadow: inset 0 0 0 1px var(--line); }
  nav button.active svg { color: var(--g2); filter: drop-shadow(0 0 6px var(--glow)); }

  /* sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(2,3,8,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet-bg.open { display: flex; }
  .sheet { width: 100%; max-width: 480px; max-height: 88dvh; overflow-y: auto; background: #0d0f1a; border: 1px solid var(--line); border-bottom: 0;
    border-radius: 24px 24px 0 0; padding: 22px 22px calc(env(safe-area-inset-bottom) + 20px); animation: up .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-top: 1px solid rgba(255,255,255,.06); font-size: 15px; gap: 12px; }
  .row:first-of-type { border-top: 0; }
  .row input[type=number] { width: 72px; background: rgba(255,255,255,.05); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-size: 16px; text-align: center; }
  .row input[type=range] { width: 150px; accent-color: var(--g2); }
  .row input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 48px; height: 28px; border-radius: 99px; background: rgba(255,255,255,.12); position: relative; transition: background .25s; flex: none; }
  .row input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .25s; }
  .row input[type=checkbox]:checked { background: linear-gradient(135deg, var(--g2), var(--g1)); }
  .row input[type=checkbox]:checked::after { transform: translateX(20px); }
  .done-btn { margin-top: 16px; width: 100%; height: 50px; border: 0; border-radius: 16px; cursor: pointer;
    background: linear-gradient(135deg, var(--g2), var(--g1)); color: var(--ink); font-weight: 900; letter-spacing: .2em; text-transform: uppercase; font-size: 13px; }
  .ver { text-align: center; color: var(--muted); font-size: 11px; margin-top: 14px; letter-spacing: .1em; }

  /* level up */
  #lvl { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
    background: radial-gradient(circle at 50% 45%, rgba(10,14,40,.72), rgba(3,4,10,.94)); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #lvl.show { display: flex; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; } }
  #lvl .t { font-size: 13px; letter-spacing: .6em; color: var(--g2); font-weight: 800; text-indent: .6em; }
  #lvl .n { font-size: 96px; font-weight: 200; line-height: 1; text-shadow: 0 0 50px var(--glow), 0 0 100px var(--glow); animation: pop .6s cubic-bezier(.2,1.4,.4,1); }
  #lvl .s { color: var(--muted); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; margin-top: 8px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
</style>
</head>
<body data-mode="focus">

<div class="wrap">
  <header>
    <div class="brand">Solo Leveling</div>
    <button class="icon-btn" id="openSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h9M19 8h1M4 16h1M11 16h9"/><circle cx="16" cy="8" r="2.4"/><circle cx="8" cy="16" r="2.4"/></svg>
    </button>
  </header>

  <div class="glass player">
    <div class="rank"><span id="rankLetter">E</span></div>
    <div class="pinfo">
      <div class="prow"><div class="lv">Lv <span id="lvNum">1</span><small id="rankName">Rank E</small></div><div class="xpn" id="xpNum">0 / 100 XP</div></div>
      <div class="bar"><i id="xpBar"></i></div>
    </div>
  </div>

  <div class="views">
    <section class="view active" id="timerView">
      <div class="glass tabs" id="tabs">
        <button class="tab active" data-mode="focus">Focus</button>
        <button class="tab" data-mode="short">Short</button>
        <button class="tab" data-mode="long">Long</button>
      </div>

      <div class="ring-wrap">
        <svg viewBox="0 0 120 120">
          <defs>
            <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="120">
              <stop offset="0" style="stop-color:var(--g2)"/><stop offset="1" style="stop-color:var(--g1)"/>
            </linearGradient>
          </defs>
          <g id="ticks"></g>
          <g class="rot">
            <circle class="track" cx="60" cy="60" r="48"/>
            <circle class="progress" id="progress" cx="60" cy="60" r="48"/>
            <circle class="endcap" id="endcap" r="2.6" cx="108" cy="60"/>
          </g>
        </svg>
        <div class="time">
          <div id="clock">25:00</div>
          <div id="label">Focus</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-side" id="reset" aria-label="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4h4"/></svg>
        </button>
        <button class="btn-main" id="toggle"><span id="toggleIcon"></span><span id="toggleText">Start</span></button>
        <button class="btn-side" id="skip" aria-label="Skip">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M6 6l9 6-9 6z"/><path d="M19 6v12" fill="none"/></svg>
        </button>
      </div>

      <div class="dots" id="dots"></div>
    </section>

    <section class="view" id="statsView"></section>
  </div>

  <nav class="glass" id="nav">
    <button class="active" data-view="timerView">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 2.5h5"/></svg>
      Timer
    </button>
    <button data-view="statsView">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg>
      Stats
    </button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h2>Settings</h2>
    <div class="row"><span>Focus (min)</span><input type="number" id="s-focus" min="1" max="180" inputmode="numeric"></div>
    <div class="row"><span>Short break (min)</span><input type="number" id="s-short" min="1" max="60" inputmode="numeric"></div>
    <div class="row"><span>Long break (min)</span><input type="number" id="s-long" min="1" max="90" inputmode="numeric"></div>
    <div class="row"><span>Rounds before long break</span><input type="number" id="s-rounds" min="2" max="10" inputmode="numeric"></div>
    <div class="row"><span>Auto-start next session</span><input type="checkbox" id="s-auto"></div>
    <div class="row"><span>Sound effects</span><input type="checkbox" id="s-sound"></div>
    <div class="row"><span>Volume</span><input type="range" id="s-volume" min="0" max="100"></div>
    <div class="row"><span>Final 3-second countdown</span><input type="checkbox" id="s-ticks"></div>
    <button class="done-btn" id="closeSettings">Done</button>
    <div class="ver" id="ver"></div>
  </div>
</div>

<div id="lvl"><div class="t">LEVEL UP</div><div class="n" id="lvlN">2</div><div class="s" id="lvlS"></div></div>

<script>
(() => {
  'use strict';
  const APP_VERSION = '2.0.0';
  const $ = id => document.getElementById(id);
  const KEY = 'sololeveling.state.v1', HKEY = 'sololeveling.history.v1';
  const defaults = { focus: 25, short: 5, long: 15, rounds: 4, auto: false, sound: true, volume: 70, ticks: true };
  const names = { focus: 'Focus', short: 'Short break', long: 'Long break' };
  const R = 48, C = 2 * Math.PI * R;

  const read = (k, f) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? f : v; } catch (e) { return f; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  /* ---------- state ---------- */
  let st = Object.assign({ mode: 'focus', completed: 0, running: false, endAt: 0, remaining: null }, read(KEY, {}));
  st.settings = Object.assign({}, defaults, st.settings || {});
  if (!names[st.mode]) st.mode = 'focus';
  if (typeof st.remaining !== 'number') st.remaining = st.settings[st.mode] * 60000;

  let history = read(HKEY, []);
  if (!Array.isArray(history)) history = [];
  history = history.filter(h => h && typeof h.t === 'number' && typeof h.s === 'number' && names[h.m]);

  const save = () => write(KEY, st);
  const durMs = m => st.settings[m] * 60000;
  const left = () => st.running ? Math.max(0, st.endAt - Date.now()) : st.remaining;

  /* ---------- audio ---------- */
  let ac, master;
  function audio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.connect(ac.destination);
        // let sound play even when the iPhone silent switch is on (Safari 16.4+)
        if (navigator.audioSession) navigator.audioSession.type = 'playback';
      } catch (e) { return null; }
    }
    if (ac.state === 'suspended') ac.resume();
    master.gain.value = Math.pow(st.settings.volume / 100, 1.6);
    return ac;
  }
  function tone(f, t0, d, o = {}) {
    const { type = 'sine', g = .3, to = null, a = .006 } = o, now = ac.currentTime + t0;
    const osc = ac.createOscillator(), v = ac.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, now);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, now + d);
    v.gain.setValueAtTime(.0001, now);
    v.gain.exponentialRampToValueAtTime(g, now + a);
    v.gain.exponentialRampToValueAtTime(.0001, now + d);
    osc.connect(v); v.connect(master); osc.start(now); osc.stop(now + d + .05);
  }
  const bell = (f, t0, d = 1.2, g = .25) => { tone(f, t0, d, { g }); tone(f * 2, t0, d * .7, { g: g * .4 }); tone(f * 3.01, t0, d * .4, { g: g * .15 }); };
  const sfx = {
    tap()   { tone(1400, 0, .05, { type: 'triangle', g: .14, to: 900 }); },
    start() { tone(392, 0, .18, { type: 'triangle', g: .25 }); tone(587, .09, .3, { type: 'triangle', g: .25 }); tone(784, .18, .5, { g: .18 }); },
    pause() { tone(587, 0, .14, { type: 'triangle', g: .22 }); tone(392, .08, .26, { type: 'triangle', g: .22 }); },
    reset() { tone(520, 0, .22, { type: 'sawtooth', g: .07, to: 200 }); },
    count() { tone(880, 0, .12, { g: .2 }); },
    focusDone() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(f, i * .13, 1.5, .22)); tone(130.8, 0, 1.3, { g: .25 }); },
    breakDone() { bell(659.25, 0, 1.1, .2); bell(880, .28, 1.5, .2); },
    levelUp() { [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568].forEach((f, i) => tone(f, i * .07, .55, { type: 'triangle', g: .17 })); bell(2093, .5, 1.8, .12); }
  };
  function play(n) {
    if (!st.settings.sound) return;
    if (!audio()) return;
    try { sfx[n](); } catch (e) {}
  }
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  /* ---------- history, XP, ranks ---------- */
  function log(m, sec, completed, t) {
    history.push({ t: t || Date.now(), m, s: Math.round(sec), c: completed ? 1 : 0 });
    if (history.length > 20000) history.splice(0, history.length - 20000);
    write(HKEY, history);
  }
  // Only real elapsed focus time counts. Leaving a focus session early is logged as "interrupted" if >= 1 minute.
  function logPartial() {
    if (st.mode !== 'focus') return;
    const el = Math.max(0, durMs('focus') - left());
    if (el >= 60000) log('focus', el / 1000, false);
  }
  const totalXp = () => history.reduce((a, h) => h.m === 'focus' ? a + Math.floor(h.s / 60) + (h.c ? 10 : 0) : a, 0);
  const T = l => 50 * l * (l - 1);                       // cumulative XP needed for level l
  const levelOf = xp => Math.max(1, Math.floor((1 + Math.sqrt(1 + 4 * xp / 50)) / 2));
  const rankOf = l => l >= 40 ? 'S' : l >= 25 ? 'A' : l >= 15 ? 'B' : l >= 10 ? 'C' : l >= 5 ? 'D' : 'E';

  /* ---------- stats ---------- */
  const dkey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const dayNum = k => { const [y, m, d] = k.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
  const agoKey = n => { const d = new Date(); d.setDate(d.getDate() - n); return dkey(d.getTime()); };
  const fmtMin = sec => { const m = Math.round(sec / 60); return m >= 60 ? Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm' : m + 'm'; };

  function stats() {
    const days = {}; let totalSec = 0, done = 0, cut = 0;
    for (const h of history) {
      if (h.m !== 'focus') continue;
      const d = days[dkey(h.t)] || (days[dkey(h.t)] = { sec: 0, n: 0 });
      d.sec += h.s; totalSec += h.s;
      if (h.c) { d.n++; done++; } else cut++;
    }
    // include the session in progress so numbers are live
    let live = 0;
    if (st.running && st.mode === 'focus') live = Math.max(0, (durMs('focus') - left()) / 1000);
    const tk = agoKey(0);
    const today = days[tk] || { sec: 0, n: 0 };
    const todaySec = today.sec + live;

    const week = [];
    for (let i = 6; i >= 0; i--) {
      const k = agoKey(i), d = days[k] || { sec: 0, n: 0 };
      week.push({ k, sec: d.sec + (i === 0 ? live : 0), wd: new Date(dayNum(k) * 864e5).toLocaleDateString(undefined, { weekday: 'narrow', timeZone: 'UTC' }) });
    }
    const heat = [];
    for (let i = 27; i >= 0; i--) { const k = agoKey(i), d = days[k]; heat.push({ k, sec: (d ? d.sec : 0) + (i === 0 ? live : 0) }); }

    const active = Object.keys(days).filter(k => days[k].n > 0).map(dayNum).sort((a, b) => a - b);
    let best = 0, run = 0;
    active.forEach((n, i) => { run = i && n - active[i - 1] === 1 ? run + 1 : 1; best = Math.max(best, run); });
    const set = new Set(active);
    let streak = 0, cur = dayNum(tk);
    if (!set.has(cur)) cur--;
    while (set.has(cur)) { streak++; cur--; }

    const weekSec = week.reduce((a, d) => a + d.sec, 0);
    const bestDay = Math.max(0, ...Object.values(days).map(d => d.sec));
    return { todaySec, todayN: today.n, weekSec, week, heat, streak, best, totalSec: totalSec + live, done, cut, bestDay, avg: weekSec / 7, live: live > 0 };
  }

  let lastStats = '';
  function renderStats() {
    const s = stats(), xp = totalXp(), lv = levelOf(xp);
    const max = Math.max(1, ...s.week.map(d => d.sec));
    const rate = s.done + s.cut ? Math.round(100 * s.done / (s.done + s.cut)) : null;
    const lvl = d => { const m = d.sec / 60; return m <= 0 ? '' : m < 15 ? 'l1' : m < 45 ? 'l2' : m < 90 ? 'l3' : 'l4'; };
    const card = (k, v, u) => `<div class="glass card"><div class="k">${k}</div><div class="v">${v}${u ? `<small>${u}</small>` : ''}</div></div>`;
    const html = `
      <div class="glass hero">
        <div><div class="k">${s.live ? '<span class="live"></span>' : ''}Today</div><div class="big">${fmtMin(s.todaySec)}</div></div>
        <div style="text-align:right"><div class="k">Sessions</div><div class="big">${s.todayN}</div></div>
      </div>
      <div class="grid">
        ${card('Day streak', s.streak, s.streak === 1 ? 'day' : 'days')}
        ${card('Best streak', s.best, s.best === 1 ? 'day' : 'days')}
        ${card('This week', fmtMin(s.weekSec))}
        ${card('Daily avg', fmtMin(s.avg))}
        ${card('Total focus', fmtMin(s.totalSec))}
        ${card('Sessions done', s.done)}
        ${card('Completion', rate == null ? '–' : rate, rate == null ? '' : '%')}
        ${card('Best day', fmtMin(s.bestDay))}
      </div>
      <div class="glass chart">
        <div class="k">Last 7 days</div>
        <div class="bars">${s.week.map((d, i) => `<div class="col ${i === 6 ? 'today' : ''} ${d.sec > 0 ? 'has' : ''}"><b>${d.sec > 0 ? fmtMin(d.sec) : ''}</b><i style="height:${Math.max(3, Math.round(d.sec / max * 100))}%"></i><span>${d.wd}</span></div>`).join('')}</div>
      </div>
      <div class="glass chart">
        <div class="k">Last 28 days</div>
        <div class="heat">${s.heat.map((d, i) => `<i class="${lvl(d)} ${i === 27 ? 'now' : ''}" title="${d.k}"></i>`).join('')}</div>
      </div>
      <div class="glass card"><div class="k">Player</div><div class="v">Lv ${lv} <small>${xp.toLocaleString()} XP total · ${(T(lv + 1) - xp).toLocaleString()} XP to Lv ${lv + 1}</small></div></div>
      <button class="link" id="wipe">Reset all stats</button>`;
    if (html !== lastStats) {
      lastStats = html;
      const top = $('statsView').scrollTop;
      $('statsView').innerHTML = html;
      $('statsView').scrollTop = top;
      const w = $('wipe');
      if (w) w.onclick = () => { if (confirm('Erase all stats, XP and level? This cannot be undone.')) { history = []; write(HKEY, history); lastStats = ''; render(); renderStats(); } };
    }
  }

  /* ---------- timer view ---------- */
  const progress = $('progress'), endcap = $('endcap');
  progress.style.strokeDasharray = C;
  (function ticks() {
    let s = '';
    for (let i = 0; i < 60; i++) {
      const a = i * Math.PI / 30, big = i % 5 === 0, r1 = big ? 55 : 56.4, r2 = 58.6;
      s += `<line class="tick ${big ? 'big' : ''}" x1="${60 + r1 * Math.sin(a)}" y1="${60 - r1 * Math.cos(a)}" x2="${60 + r2 * Math.sin(a)}" y2="${60 - r2 * Math.cos(a)}"/>`;
    }
    $('ticks').innerHTML = s;
  })();

  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a.6.6 0 0 0 .92.5l10.6-6.8a.6.6 0 0 0 0-1L8.92 4.7A.6.6 0 0 0 8 5.2z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>';
  const fmt = ms => { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

  let lastLv = null;
  function render() {
    const ms = left(), dur = durMs(st.mode), frac = Math.min(1, Math.max(0, ms / dur));
    $('clock').textContent = fmt(ms);
    $('label').innerHTML = (st.running ? '<span class="live"></span>' : '') + names[st.mode];
    $('toggleText').textContent = st.running ? 'Pause' : (ms < dur ? 'Resume' : 'Start');
    $('toggleIcon').innerHTML = st.running ? ICON_PAUSE : ICON_PLAY;
    document.body.dataset.mode = st.mode;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === st.mode));
    progress.style.strokeDashoffset = C * (1 - frac);
    const th = frac * 2 * Math.PI;
    endcap.setAttribute('cx', 60 + R * Math.cos(th)); endcap.setAttribute('cy', 60 + R * Math.sin(th));
    endcap.style.display = frac > 0 ? '' : 'none';
    document.title = st.running ? fmt(ms) + ' · Solo Leveling' : 'Solo Leveling';

    const dots = $('dots'); dots.innerHTML = '';
    for (let i = 0; i < st.settings.rounds; i++) { const d = document.createElement('span'); d.className = 'dot' + (i < st.completed ? ' done' : ''); dots.appendChild(d); }

    const xp = totalXp(), lv = levelOf(xp), base = T(lv), need = T(lv + 1) - base;
    $('lvNum').textContent = lv; $('rankLetter').textContent = rankOf(lv); $('rankName').textContent = 'Rank ' + rankOf(lv);
    $('xpNum').textContent = (xp - base) + ' / ' + need + ' XP';
    $('xpBar').style.width = ((xp - base) / need * 100) + '%';
    lastLv = lv;
  }

  /* ---------- core ---------- */
  let countSec = null;
  function setMode(mode, autostart, skipLog) {
    if (!skipLog) logPartial();
    st.mode = mode; st.running = false; st.remaining = durMs(mode); countSec = null;
    if (autostart) { start(true); return; }
    save(); render();
  }
  function start(silent) {
    if (!silent) play('start'); else audio();
    st.running = true; st.endAt = Date.now() + st.remaining; countSec = null;
    lockScreen(); save(); render();
  }
  function pause() { play('pause'); st.remaining = left(); st.running = false; unlockScreen(); save(); render(); }

  function finish() {
    const m = st.mode, endT = st.endAt, before = levelOf(totalXp());
    log(m, durMs(m) / 1000, true, endT);
    st.running = false; st.remaining = 0; unlockScreen();
    let next = 'focus';
    if (m === 'focus') {
      st.completed++;
      next = st.completed >= st.settings.rounds ? 'long' : 'short';
      if (next === 'long') st.completed = 0;
      play('focusDone'); buzz([200, 100, 200, 100, 300]);
      const after = levelOf(totalXp());
      if (after > before) setTimeout(() => levelUp(before, after), 700);
    } else { play('breakDone'); buzz([200, 100, 200]); }
    setMode(next, st.settings.auto, true);
    if (view === 'statsView') renderStats();
  }

  function levelUp(a, b) {
    $('lvlN').textContent = b;
    $('lvlS').textContent = rankOf(b) !== rankOf(a) ? 'Rank up · ' + rankOf(a) + ' → ' + rankOf(b) : 'Rank ' + rankOf(b);
    $('lvl').classList.add('show'); play('levelUp'); buzz([60, 40, 60, 40, 200]);
    clearTimeout(levelUp.t); levelUp.t = setTimeout(() => $('lvl').classList.remove('show'), 3200);
  }
  $('lvl').onclick = () => $('lvl').classList.remove('show');

  let reloadPending = false;
  function tick() {
    if (st.running) {
      const ms = left();
      if (ms <= 0) finish();
      else {
        const s = Math.ceil(ms / 1000);
        if (st.settings.ticks && s <= 3 && s !== countSec && document.visibilityState === 'visible') { countSec = s; play('count'); }
        render();
      }
    } else if (reloadPending) { location.reload(); return; }
    if (view === 'statsView') renderStats();
  }

  $('toggle').onclick = () => st.running ? pause() : start();
  $('reset').onclick = () => { play('reset'); logPartial(); st.running = false; st.remaining = durMs(st.mode); unlockScreen(); countSec = null; save(); render(); };
  $('skip').onclick = () => {
    play('tap');
    if (st.mode === 'focus') return setMode('short');          // abandoned: logged as interrupted, round not counted
    setMode('focus');
  };
  $('tabs').onclick = e => { const b = e.target.closest('.tab'); if (b && b.dataset.mode !== st.mode) { play('tap'); setMode(b.dataset.mode); } };

  /* ---------- views ---------- */
  let view = 'timerView';
  $('nav').onclick = e => {
    const b = e.target.closest('button'); if (!b || b.dataset.view === view) return;
    play('tap'); view = b.dataset.view;
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === view));
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x.dataset.view === view));
    if (view === 'statsView') { lastStats = ''; renderStats(); }
  };

  /* ---------- settings ---------- */
  const num = { focus: 's-focus', short: 's-short', long: 's-long', rounds: 's-rounds' };
  $('openSettings').onclick = () => {
    play('tap');
    for (const k in num) $(num[k]).value = st.settings[k];
    $('s-auto').checked = st.settings.auto; $('s-sound').checked = st.settings.sound;
    $('s-volume').value = st.settings.volume; $('s-ticks').checked = st.settings.ticks;
    $('sheetBg').classList.add('open');
  };
  let vt; $('s-volume').oninput = e => { st.settings.volume = +e.target.value; clearTimeout(vt); vt = setTimeout(() => play('tap'), 80); };
  function closeSettings() {
    const before = JSON.stringify([st.settings.focus, st.settings.short, st.settings.long]);
    const wasRunning = st.running, prevDur = durMs(st.mode);
    for (const k in num) { const v = parseInt($(num[k]).value, 10); if (v > 0) st.settings[k] = v; }
    st.settings.auto = $('s-auto').checked; st.settings.sound = $('s-sound').checked; st.settings.ticks = $('s-ticks').checked;
    if (JSON.stringify([st.settings.focus, st.settings.short, st.settings.long]) !== before && durMs(st.mode) !== prevDur) {
      if (st.mode === 'focus') { const el = Math.max(0, prevDur - left()); if (el >= 60000) log('focus', el / 1000, false); }
      st.running = false; st.remaining = durMs(st.mode); unlockScreen();
    }
    if (st.completed >= st.settings.rounds) st.completed = 0;
    $('sheetBg').classList.remove('open'); play('tap'); save(); render();
  }
  $('closeSettings').onclick = closeSettings;
  $('sheetBg').onclick = e => { if (e.target === $('sheetBg')) closeSettings(); };
  $('ver').textContent = 'Solo Leveling · v' + APP_VERSION;

  /* ---------- keep screen awake while running ---------- */
  let wake;
  async function lockScreen() { try { if ('wakeLock' in navigator && st.running) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
  function unlockScreen() { try { wake && wake.release(); } catch (e) {} wake = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tick(); render(); lockScreen(); } });

  /* ---------- auto-update ---------- */
  if ('serviceWorker' in navigator) {
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) { hadController = true; return; }
      reloadPending = true;                 // reload as soon as the timer isn't running
      if (!st.running) location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
        const check = () => reg.update().catch(() => {});
        check();
        setInterval(check, 30 * 60 * 1000);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      }).catch(() => {});
    });
  }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

  /* ---------- go ---------- */
  setInterval(tick, 250);
  render();
  if (st.running) { lockScreen(); tick(); }
})();
</script>
</body>
</html>
